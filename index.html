<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ruxsoraning Kundaligi</title>
  <style>
    :root {
      --bg-1: #ffffff;
      --bg-2: #e0f2fe;
      --bg-3: #bae6fd;
      --card: rgba(255, 255, 255, 0.78);
      --border: rgba(125, 211, 252, 0.55);
      --text: #0c4a6e;
      --muted: #387294;
      --accent: #38bdf8;
      --accent-light: #7dd3fc;
      --accent-deep: #0284c7;
      --success: #059669;
      --danger: #e11d48;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 12% 10%, rgba(255, 255, 255, 0.95), transparent 42%),
        radial-gradient(circle at 85% 15%, rgba(125, 211, 252, 0.55), transparent 45%),
        radial-gradient(circle at 50% 90%, rgba(186, 230, 253, 0.65), transparent 50%),
        linear-gradient(145deg, var(--bg-1) 0%, var(--bg-2) 52%, var(--bg-3) 100%);
      padding: 36px 16px 64px;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin-bottom: 28px;
    }

    .badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.4px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.92), rgba(224, 242, 254, 0.85));
      border: 1px solid rgba(56, 189, 248, 0.45);
      color: var(--accent-deep);
      box-shadow: 0 4px 14px rgba(56, 189, 248, 0.18), inset 0 1px 0 rgba(255, 255, 255, 1);
      margin-bottom: 12px;
    }

    h1 {
      font-size: clamp(28px, 4.5vw, 40px);
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #0369a1 0%, #0ea5e9 55%, #38bdf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 10px rgba(56, 189, 248, 0.22));
    }

    .subtitle {
      color: var(--muted);
      font-size: 15px;
    }

    .panel {
      position: relative;
      overflow: hidden;
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.9), rgba(240, 249, 255, 0.72));
      border: 1px solid var(--border);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-radius: 22px;
      padding: 24px;
      box-shadow:
        0 18px 40px rgba(14, 165, 233, 0.14),
        0 4px 12px rgba(2, 132, 199, 0.06),
        inset 0 1.5px 1px rgba(255, 255, 255, 0.98);
      margin-bottom: 24px;
    }

    .panel::before {
      content: "";
      position: absolute;
      top: 0;
      left: -40%;
      width: 180%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 1), rgba(125, 211, 252, 0.8), transparent);
    }

    .form-grid {
      display: grid;
      gap: 14px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--accent-deep);
      margin-bottom: 6px;
    }

    input,
    textarea {
      width: 100%;
      border-radius: 13px;
      border: 1px solid rgba(125, 211, 252, 0.65);
      background: rgba(255, 255, 255, 0.88);
      color: var(--text);
      font-size: 15px;
      font-family: inherit;
      padding: 12px 14px;
      outline: none;
      box-shadow: inset 0 2px 5px rgba(14, 165, 233, 0.06);
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    }

    input::placeholder,
    textarea::placeholder {
      color: #7da8c4;
    }

    input:focus,
    textarea:focus {
      background: #ffffff;
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.22), 0 4px 14px rgba(56, 189, 248, 0.15);
    }

    textarea {
      min-height: 92px;
      resize: vertical;
    }

    .actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 6px;
    }

    button {
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 13px;
      padding: 12px 26px;
      font-size: 15px;
      font-weight: 700;
      color: #ffffff;
      background: linear-gradient(135deg, #38bdf8 0%, #0ea5e9 50%, #7dd3fc 100%);
      box-shadow:
        0 8px 22px rgba(14, 165, 233, 0.35),
        inset 0 1px 1px rgba(255, 255, 255, 0.85);
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.2s, opacity 0.2s;
    }

    button::after {
      content: "";
      position: absolute;
      top: -50%;
      left: -60%;
      width: 45%;
      height: 200%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.65), transparent);
      transform: rotate(25deg);
      transition: left 0.55s ease;
    }

    button:hover:not(:disabled)::after {
      left: 130%;
    }

    button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow:
        0 12px 26px rgba(14, 165, 233, 0.45),
        inset 0 1px 1px rgba(255, 255, 255, 0.95);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .status {
      font-size: 13px;
      font-weight: 600;
      min-height: 20px;
    }

    .status.ok {
      color: var(--success);
    }

    .status.err {
      color: var(--danger);
    }

    .list-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .list-header h2 {
      font-size: 18px;
      color: #0369a1;
    }

    .count-pill {
      font-size: 12px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 999px;
      background: linear-gradient(135deg, #ffffff, #e0f2fe);
      border: 1px solid rgba(56, 189, 248, 0.45);
      color: var(--accent-deep);
      box-shadow: 0 2px 8px rgba(56, 189, 248, 0.15);
    }

    .entries {
      display: grid;
      gap: 12px;
    }

    .entry {
      padding: 16px;
      border-radius: 15px;
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.95), rgba(224, 242, 254, 0.55));
      border: 1px solid rgba(125, 211, 252, 0.5);
      box-shadow:
        0 6px 16px rgba(14, 165, 233, 0.08),
        inset 0 1px 0 rgba(255, 255, 255, 1);
      transition: transform 0.15s, box-shadow 0.2s;
    }

    .entry:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 22px rgba(14, 165, 233, 0.14);
    }

    .entry-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
    }

    .entry-name {
      font-weight: 700;
      color: #0284c7;
    }

    .entry-time {
      font-size: 12px;
      color: var(--muted);
    }

    .entry-msg {
      color: var(--text);
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 24px 12px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="badge">✨ Ruxsoraning Shaxsiy Sahifasi</div>
      <h1>Ruxsoraning Kundaligi</h1>
      <p class="subtitle">Ismingizni va samimiy fikr yoki tilagingizni qoldiring — yozuvlar bazada saqlanadi.</p>
    </div>

    <div class="panel">
      <form id="guestForm" class="form-grid">
        <div>
          <label for="nameInput">Ismingiz</label>
          <input id="nameInput" name="name" type="text" maxlength="60" placeholder="Masalan: Ruxsora" required />
        </div>
        <div>
          <label for="messageInput">Kundalik qaydi yoki tilak</label>
          <textarea id="messageInput" name="message" maxlength="400" placeholder="Bugungi fikr yoki tilagingizni yozing..." required></textarea>
        </div>
        <div class="actions">
          <button id="submitBtn" type="submit">Saqlash</button>
          <div id="statusMsg" class="status"></div>
        </div>
      </form>
    </div>

    <div class="panel">
      <div class="list-header">
        <h2>Kundalik yozuvlari</h2>
        <span id="countBadge" class="count-pill">0 ta</span>
      </div>
      <div id="entriesList" class="entries">
        <div class="empty">Yuklanmoqda...</div>
      </div>
    </div>
  </div>

  <script>
    const API = "/.netlify/functions/api";
    const form = document.getElementById("guestForm");
    const nameInput = document.getElementById("nameInput");
    const messageInput = document.getElementById("messageInput");
    const submitBtn = document.getElementById("submitBtn");
    const statusMsg = document.getElementById("statusMsg");
    const entriesList = document.getElementById("entriesList");
    const countBadge = document.getElementById("countBadge");

    function setStatus(text, type = "") {
      statusMsg.textContent = text;
      statusMsg.className = `status ${type}`;
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function formatDate(raw) {
      if (!raw) return "";
      const d = new Date(raw);
      if (Number.isNaN(d.getTime())) return String(raw);
      return d.toLocaleString("uz-UZ");
    }

    function renderEntries(items) {
      const list = Array.isArray(items) ? items : [];
      countBadge.textContent = `${list.length} ta`;

      if (!list.length) {
        entriesList.innerHTML = `<div class="empty">Hali yozuvlar yo‘q. Birinchi bo‘lib yozib qoldiring!</div>`;
        return;
      }

      entriesList.innerHTML = list.map((item) => {
        const name = escapeHtml(item.name || item.ism || "Mehmon");
        const message = escapeHtml(item.message || item.xabar || "");
        const time = escapeHtml(formatDate(item.created_at || item.createdAt || ""));
        return `
          <article class="entry">
            <div class="entry-top">
              <span class="entry-name">${name}</span>
              <span class="entry-time">${time}</span>
            </div>
            <p class="entry-msg">${message || "Xabar qoldirilgan."}</p>
          </article>
        `;
      }).join("");
    }

    async function loadEntries() {
      try {
        const res = await fetch(API);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        const rows = Array.isArray(data) ? data : (data.entries || data.data || data.rows || []);
        renderEntries(rows);
      } catch (err) {
        entriesList.innerHTML = `<div class="empty">Ma’lumotlarni yuklashda xatolik: ${escapeHtml(err.message)}</div>`;
      }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = nameInput.value.trim();
      const message = messageInput.value.trim();

      if (!name || !message) {
        setStatus("Ism va xabarni to‘liq kiriting.", "err");
        return;
      }

      submitBtn.disabled = true;
      setStatus("Bazaga saqlanmoqda...", "");

      try {
        const res = await fetch(API, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, message })
        });
        if (!res.ok) {
          const errText = await res.text();
          throw new Error(errText || `HTTP ${res.status}`);
        }
        nameInput.value = "";
        messageInput.value = "";
        setStatus("Xabar muvaffaqiyatli saqlandi!", "ok");
        await loadEntries();
      } catch (err) {
        setStatus(`Xatolik: ${err.message}`, "err");
      } finally {
        submitBtn.disabled = false;
      }
    });

    loadEntries();
  </script>
</body>
</html>
